[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cathaybk-data-sync"
version = "1.0.0"
description = "國泰 Apptio 雲端認證資料同步工具"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "ruamel.yaml>=0.18",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "apscheduler>=3.10",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "responses>=0.25",
    "ruff>=0.4",
]

[project.scripts]
datasync = "datasync.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datasync*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
